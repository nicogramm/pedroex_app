<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PedroEX">
<meta name="theme-color" content="#e0e0e5">
<link rel="preconnect" href="https://pedroex-gps-proxy.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://pedroex-gps-proxy.onrender.com">
<link rel="manifest" href="manifest.json">
<title>GPS Tracking — PedroEX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e0e0e5;
  --bg2: #e8e8ed;
  --shadow-d: #b8b9be;
  --shadow-l: #ffffff;
  --text: #2a2a2e;
  --text2: #777;
  --text3: #aaa;
  --red: #B32533;
  --green: #16a34a;
  --blue: #2563eb;
  --orange: #f59e0b;
  --neu-out: 6px 6px 14px var(--shadow-d), -4px -4px 10px var(--shadow-l);
  --neu-in: inset 4px 4px 8px var(--shadow-d), inset -3px -3px 7px var(--shadow-l);
  --neu-sm: 4px 4px 8px var(--shadow-d), -3px -3px 7px var(--shadow-l);
}
body.dark {
  --bg: #2a2a2f;
  --bg2: #313137;
  --shadow-d: #16161a;
  --shadow-l: #3e3e46;
  --text: #e8e8ec;
  --text2: #888;
  --text3: #555;
}
*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
.screen { display: flex; flex-direction: column; height: 100dvh; width: 100%; }
.topbar { background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); flex-shrink: 0; box-shadow: 0 3px 10px rgba(0,0,0,0.07); position: relative; z-index: 50; }
body.dark .topbar { box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
.tb-back { background: var(--bg); border: none; border-radius: 12px; box-shadow: var(--neu-sm); width: 40px; height: 40px; color: var(--red); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tb-back:active { box-shadow: var(--neu-in); transform: scale(0.95); }
.tb-title { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; color: var(--text); position: absolute; left: 50%; transform: translateX(-50%); }
.tb-btn { background: var(--bg); border: none; border-radius: 12px; box-shadow: var(--neu-sm); width: 40px; height: 40px; color: var(--red); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tb-btn:active { box-shadow: var(--neu-in); transform: scale(0.95); }
.tb-btn.spinning svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.truck-row { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
.truck-btn { flex-shrink: 0; background: var(--bg); border: none; border-radius: 12px; box-shadow: var(--neu-sm); padding: 10px 16px; font-size: 12.5px; font-weight: 700; color: var(--text2); cursor: pointer; font-family: Inter, sans-serif; white-space: nowrap; }
.truck-btn.active { box-shadow: var(--neu-in); color: var(--red); }
.truck-btn:active { transform: scale(0.97); }

.frame-wrap { flex: 1; position: relative; background: #111; }
.frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

.empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #aaa; text-align: center; padding: 24px; }
.empty-icon { font-size: 40px; opacity: 0.5; }
.empty-text { font-size: 13px; line-height: 1.6; }

.loading-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); color: var(--text3); font-size: 13px; z-index: 5; }
.spinner { width: 22px; height: 22px; border: 2px solid var(--text3); border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: space-around; box-shadow: 0 -3px 14px rgba(0, 0, 0, 0.07); z-index: 40; }
body.dark .bottom-nav { box-shadow: 0 -3px 14px rgba(0, 0, 0, 0.4); }
.bnav { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text3); cursor: pointer; border: none; background: transparent; font-family: Inter, sans-serif; }
.bnav.active { color: var(--red); }
.bnav-icon { width: 42px; height: 42px; border-radius: 14px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.bnav:not(.active) .bnav-icon { box-shadow: var(--neu-sm); }
.bnav.active .bnav-icon { box-shadow: var(--neu-in); }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <button class="tb-back" onclick="location.href='index.html'">✕</button>
    <div class="tb-title">GPS Tracking</div>
    <button class="tb-btn" id="refresh-btn" onclick="reloadCurrentTruck()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 2v6h-6M3 22v-6h6M2.5 9a9.5 9.5 0 0116.4-4.8L21 8M21.5 15a9.5 9.5 0 01-16.4 4.8L3 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="truck-row" id="truck-row"></div>

  <div class="frame-wrap">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🛰️</div>
      <div class="empty-text">Select a truck above to see<br>its live GPS location.</div>
    </div>
    <div class="loading-overlay" id="loading-overlay" style="display:none">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
    <iframe id="gps-frame" style="display:none"></iframe>
  </div>

  <div class="bottom-nav">
    <button class="bnav" onclick="location.href='index.html'">
      <div class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke="currentColor" stroke-width="2"/><path d="M9 22V12h6v10" stroke="currentColor" stroke-width="2"/></svg></div>
      Home
    </button>
    <button class="bnav" onclick="location.href='trucks.html'">
      <div class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="1" y="8" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/><path d="M15 11h4l3 4v3h-7" stroke="currentColor" stroke-width="2"/><circle cx="5" cy="19" r="2" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2" stroke="currentColor" stroke-width="2"/></svg></div>
      Trucks
    </button>
    <button class="bnav active">
      <div class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="2"/></svg></div>
      GPS
    </button>
    <button class="bnav" onclick="location.href='billing.html'">
      <div class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 7h8M8 11h8M8 15h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      Billing
    </button>
    <button class="bnav" onclick="location.href='advisor.html'">
      <div class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
      Advisor
    </button>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// CONFIG — change PROXY_BASE if your Render URL ever changes
// ═══════════════════════════════════════
const PROXY_BASE = 'https://pedroex-gps-proxy.onrender.com';

(function init() {
  const dark = localStorage.getItem('pedroex-theme') === 'dark';
  document.body.classList.toggle('dark', dark);

  // Same admin-only gate the rest of PedroEX uses.
  const token = localStorage.getItem('pedroex-token') || '';
  const expiry = parseInt(localStorage.getItem('pedroex-token-expiry') || '0');
  if (!token || Date.now() >= expiry) {
    location.href = 'index.html';
    return;
  }

  loadTruckList();
})();

let currentTruckId = null;

async function loadTruckList() {
  const row = document.getElementById('truck-row');
  row.innerHTML = '<span style="color:var(--text3);font-size:12px;padding:8px">Loading truck list...</span>';
  try {
    const res = await fetch(PROXY_BASE + '/api/trucks');
    const trucks = await res.json();
    if (!trucks.length) {
      row.innerHTML = '<span style="color:var(--text3);font-size:12px;padding:8px">No trucks configured on the proxy server.</span>';
      return;
    }
    row.innerHTML = trucks
      .map((t) => `<button class="truck-btn" id="truck-btn-${t.id}" onclick="selectTruck('${t.id}')">${t.name}</button>`)
      .join('');
  } catch (err) {
    row.innerHTML = '<span style="color:var(--red);font-size:12px;padding:8px">Could not reach the GPS proxy server. It may still be waking up (free tier) — try again in about 30 seconds.</span>';
  }
}

function selectTruck(truckId) {
  currentTruckId = truckId;
  document.querySelectorAll('.truck-btn').forEach((b) => b.classList.remove('active'));
  const btn = document.getElementById('truck-btn-' + truckId);
  if (btn) btn.classList.add('active');

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('loading-overlay').style.display = 'flex';

  const frame = document.getElementById('gps-frame');
  frame.style.display = 'none';
  frame.onload = () => {
    document.getElementById('loading-overlay').style.display = 'none';
    frame.style.display = 'block';
  };
  // /select/:id logs the truck in server-side and redirects into the
  // proxied aika168 dashboard — loading that directly in the iframe.
  frame.src = PROXY_BASE + '/select/' + encodeURIComponent(truckId);
}

function reloadCurrentTruck() {
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.classList.add('spinning');
  if (currentTruckId) {
    selectTruck(currentTruckId);
  }
  setTimeout(() => refreshBtn.classList.remove('spinning'), 800);
}
</script>
</body>
</html>
